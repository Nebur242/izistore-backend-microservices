apiVersion: v1
kind: Pod
metadata:
  name: postgres-0
  namespace: prod
  labels:
    app: postgres
spec:
  containers:
    - name: postgres
      image: postgres:14-alpine
      ports:
        - containerPort: 5432
          protocol: TCP
      env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_DB
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
      resources:
        limits:
          cpu: 200m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 256Mi
      volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
          subPath: pgdata
      livenessProbe:
        exec:
          command:
            - pg_isready
            - '-U'
            - $(POSTGRES_USER)
        initialDelaySeconds: 20
        timeoutSeconds: 1
        periodSeconds: 20
        successThreshold: 1
        failureThreshold: 3
      readinessProbe:
        exec:
          command:
            - pg_isready
            - '-U'
            - $(POSTGRES_USER)
        initialDelaySeconds: 5
        timeoutSeconds: 1
        periodSeconds: 10
        successThreshold: 1
        failureThreshold: 3
      terminationMessagePath: /dev/termination-log
      terminationMessagePolicy: File
      imagePullPolicy: IfNotPresent
  volumes:
    - name: postgres-data
      persistentVolumeClaim:
        claimName: postgres-pvc
  restartPolicy: Always
  terminationGracePeriodSeconds: 30
  dnsPolicy: ClusterFirst
  serviceAccountName: default
  securityContext:
    fsGroup: 999
    runAsUser: 999
  hostname: postgres-0
  subdomain: postgres-service
