version: '3.8'

services:
  api-gateway-prod:
    build:
      context: .
      dockerfile: ./apps/api-gateway/docker/Dockerfile.prod
    ports:
      - '3001:3001'
    environment:
      env_file: './apps/api-gateway/.env.prod'
    restart: unless-stopped
    networks:
      - internal_network
      - external_network
    depends_on:
      - redis

  auth-service-prod:
    build:
      context: .
      dockerfile: ./apps/auth-service/docker/Dockerfile.prod
    ports:
      - '3002:3002'
    environment:
      env_file: './apps/api-gateway/.env.prod'
    restart: unless-stopped
    networks:
      - internal_network
      - external_network
    depends_on:
      auth-db:
        condition: service_healthy

  auth-db:
    image: postgres:14-alpine
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - internal_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - internal_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-gateway-prod
      - auth-service-prod
    networks:
      - external_network
    restart: unless-stopped

volumes:
  auth_db_data:
  redis_data:

networks:
  internal_network:
    driver: bridge
  external_network:
    driver: bridge
