name: Continuous Deployment

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed
  pull_request:
    types:
      - closed

jobs:
  deploy:
    name: Deploy Changed Services
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }} # Use secrets for sensitive info
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_TARGET_PATH: /home/${{secrets.EC2_USER}}/izistore-backend-microservices
      KUBECONFIG_PATH: /home/${{secrets.EC2_USER}}/.kube/config

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install rsync -y

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Copy Files to EC2
        run: |
          rsync -avz --exclude='.git' -e "ssh -o StrictHostKeyChecking=no" ./ $EC2_USER@$EC2_HOST:/home/${{secrets.EC2_USER}}/izistore-backend-microservices

      - name: Pull Images from Docker Hub and Deploy to Kind Cluster
        run: |
          ssh -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} << EOF
            cd ${EC2_TARGET_PATH}

            # Add user to docker group if it doesn't exist and refresh session
            if ! groups $EC2_USER | grep -q docker; then
               sudo usermod -aG docker $EC2_USER
               newgrp docker
            fi

            # Login to Docker Hub (If needed for private images)
            docker login --username "${{secrets.DOCKER_USERNAME}}" -p "${{secrets.DOCKER_PASSWORD}}"
            
            # Pull and load images to Kind cluster
            images=("nebur242/izistore-backend-microservices:api-gateway")

            temp_dir="/tmp/docker-images"
            echo "$temp_dir"
            sudo mkdir -p /tmp/docker-images

            for image in "\${images[@]}"; do
                # Trim any leading/trailing whitespace and check if the image is empty
                image=$(echo "$image" | xargs)

                if [ -z "$image" ]; then
                    echo "Skipping empty image name."
                    continue
                fi

                echo "Pulling image: $image"
                if ! docker pull "$image"; then
                    echo "Error: Failed to pull image $image from Docker Hub."
                    continue
                fi

                # Generate a unique tar file for the image
                image_file="$temp_dir/$(echo "$image" | tr '/:' '_').tar"
                echo "Saving image to temporary file: $image_file"
                if ! docker save -o "$image_file" "$image"; then
                    echo "Error: Failed to save image $image to $image_file."
                    continue
                fi

                echo "Loading image into kind: $image_file"
                if ! kind load image-archive "$image_file"; then
                    echo "Error: Failed to load image $image into kind."
                    continue
                fi

                echo "Image $image successfully loaded into kind."
            done

            # Cleanup
            echo "Cleaning up temporary files..."
            sudo rm -rf "$temp_dir"

            # Set KUBECONFIG
            export KUBECONFIG=${KUBECONFIG_PATH}

            # Apply Kubernetes manifests
            echo "Applying kubernetes manifests"
            kubectl apply -f kubernetes/*.yml
            echo "Deployment Complete!"
          EOF
