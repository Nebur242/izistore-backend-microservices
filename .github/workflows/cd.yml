name: Continuous Deployment

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed
  pull_request:
    types:
      - closed

jobs:
  docker:
    name: Build and Deploy Changed Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Determine affected projects
        id: affected
        run: |
          BASE_BRANCH=$(git rev-parse --verify main~1 || echo main)
          echo "BASE_BRANCH=$BASE_BRANCH" >> $GITHUB_ENV
          npx nx show projects --affected --base=$BASE_BRANCH --head=HEAD

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and tag Docker images
        run: |
          for service in $AFFECTED; do
            docker build -t izistore/$service ./apps/$service
          done

      - name: Push Docker images
        run: |
          for service in $AFFECTED; do
            docker push izistore/$service
          done

  deploy:
    name: Deploy Changed Services
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Deploy to server
        run: |
          echo "Done!";
