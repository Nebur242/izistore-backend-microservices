name: Continuous Deployment

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed
  pull_request:
    types:
      - closed

jobs:
  docker:
    name: Build and Deploy Changed Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Fetch Doppler Secrets
        run: |
          doppler configure set token ${{ secrets.DOPPLER_TOKEN }}
          doppler secrets --project izistore --config prd --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file > .env

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Determine affected projects
        id: affected
        run: |
          BASE_BRANCH=$(git rev-parse --verify main~1 || echo main)
          echo "BASE_BRANCH=$BASE_BRANCH" >> $GITHUB_ENV
          AFFECTED=$(npx nx show projects --affected --base=$BASE_BRANCH --head=HEAD)
          if [ -z "$AFFECTED" ]; then
              echo "No affected services. Deploying all services."
              AFFECTED=api-gateway
          fi
          echo "AFFECTED=$AFFECTED" >> $GITHUB_ENV

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker images using docker-compose
        run: |
          for service in $AFFECTED; do
             docker compose build $service
             docker push ${{ secrets.DOCKER_USERNAME }}/izistore-backend-microservices:$service
           done

  deploy:
    name: Deploy Changed Services
    runs-on: ubuntu-latest
    needs: docker
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }} # Use secrets for sensitive info
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Deploy docker image to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{secrets.EC2_USER}}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |-
            sudo yum update
            sudo rpm --import 'https://packages.doppler.com/public/cli/gpg.DE2A7741A397C129.key'
            curl -sLf --retry 3 --tlsv1.2 --proto "=https" 'https://packages.doppler.com/public/cli/config.rpm.txt' | sudo tee /etc/yum.repos.d/doppler-cli.repo
            sudo yum update -y && sudo yum install doppler
            doppler --version
            sudo yum install docker.io -y
            sudo rm /usr/local/bin/docker-compose
            sudo curl -SL https://github.com/docker/compose/releases/download/v2.32.0/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            scp -o StrictHostKeyChecking=no -r ./ ${EC2_USER}@${EC2_HOST}:/home/${{secrets.EC2_USER}}/izistore-backend-microservices
            sudo cd /home/${{secrets.EC2_USER}}/izistore-backend-microservices
            doppler secrets --project izistore --config prd --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file > .env
            sudo docker-compose up -d

      - name: Optional - Post Deployment Steps
        run: echo "Deployment Complete!"
