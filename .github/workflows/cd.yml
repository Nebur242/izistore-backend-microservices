name: Continuous Deployment

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed
  pull_request:
    types:
      - closed

jobs:
  deploy:
    name: Deploy Changed Services
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }} # Use secrets for sensitive info
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_TARGET_PATH: /home/${{secrets.EC2_USER}}/izistore-backend-microservices
      KUBECONFIG_PATH: /home/${{secrets.EC2_USER}}/.kube/config
      KIND_CLUSTER: izistore-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Affected Services Artifact
        uses: actions/download-artifact@v3
        with:
          name: affected-services

      - name: Read Affected Services and Set Environment Variable
        id: set-env
        run: |
          AFFECTED_SERVICES=$(cat affected-services.txt)
          echo $AFFECTED_SERVICES
          echo "AFFECTED_SERVICES=$AFFECTED_SERVICES" >> $GITHUB_ENV

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install rsync -y

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Fetch Doppler Secrets
        run: |
          doppler configure set token ${{ secrets.DOPPLER_TOKEN }}
          doppler secrets --project izistore --config prd --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file > .env

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Copy Files to EC2
        run: |
          rsync -avz --exclude='.git' -e "ssh -o StrictHostKeyChecking=no" ./ $EC2_USER@$EC2_HOST:/home/${{secrets.EC2_USER}}/izistore-backend-microservices

      - name: Pull Images from Docker Hub and Deploy to Kind Cluster
        run: |
          ssh -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} << EOF
            set -e  # Exit immediately if a command exits with a non-zero status

            sudo su

            # Switch to the deployment directory
            cd ${EC2_TARGET_PATH}

            # Install global dependencies
            echo "Installing global dependencies..."
            npm install -g nx

            # Install project dependencies
            echo "Installing project dependencies..."
            npm install

            # Add user to docker group if it doesn't exist and refresh session
            if ! groups $EC2_USER | grep -q docker; then
              sudo usermod -aG docker $EC2_USER
              newgrp docker
            fi

            # echo "BASE_BRANCH=\$BASE_BRANCH"
            AFFECTED=$(npx nx show projects --affected --base=HEAD~1 --head=HEAD || echo "")
            echo $AFFECTED
            FILTERED_SERVICES=$(echo "$AFFECTED" | tr ' ' '\n' | grep -v "e2e" | grep -v "api-tools" | tr '\n' ' ')
            echo $FILTERED_SERVICES
            echo "AFFECTED_SERVICES=$FILTERED_SERVICES" >> $GITHUB_ENV

            if [ -z "\$AFFECTED_SERVICES" ]; then
              echo "No affected services. Deploying all services."
              exit 0
            fi


            # Pull and load images to Kind cluster
            images=("\$AFFECTED_SERVICES")

            #swith kubectl context
            kubectl config use-context kind-izistore-api

            # Dump secret env vars
            echo "Generating k8s secrets..."
            mkdir -p kubernetes/secret
            kubectl create secret generic secret-env-vars --from-env-file=.env -o yaml --dry-run=client > kubernetes/secret/k8s-secret.yaml

            # Apply the secrets to cluster            
            echo "Applying k8s secrets..."
            kubectl apply -f kubernetes/secret/k8s-secret.yaml

            for image in \${images[@]}; do
              echo "Processing image: \$image"

              APP_DIR="apps/\$image"

              if [ ! -d "\$APP_DIR" ]; then
                echo "Directory $APP_DIR does not exist. Skipping \$APP_DIR."
                continue
              fi

              if [ -z "\$image" ]; then
                  echo "Skipping empty image name."
                  continue
              fi

              echo "Building image: \$image"
              nx run "\$image":build || { echo "Failed to build $image"; continue; }

              echo "Copy env vars to \$image"
              cp .env "dist/apps/\$image"

              echo "Building docker image: $image"
              docker build -t "nebur242/izistore-backend-microservices:\$image"  "dist/apps/\$image"

              # Load image into Kind
              echo "Loading image into Kind for \$image..."
              kind load docker-image "nebur242/izistore-backend-microservices:\$image" --name=izistore-api || { echo "Failed to load $image into Kind"; continue; }

              # Apply Kubernetes manifests
              echo "Applying Kubernetes manifests for \$image..."
              kubectl apply -f "kubernetes/\$image" || { echo "Failed to apply manifests for $image"; continue; }
              echo "Kubernetes redeployment for \$image..."
              kubectl rollout restart deployment --selector=app=\$image
              echo "kubernetes config successfully set..."
            done

            echo "Deployment Complete!"
          EOF
