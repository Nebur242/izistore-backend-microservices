name: Continuous Deployment

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed
  pull_request:
    types:
      - closed

jobs:
  docker:
    name: Build and Deploy Changed Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Fetch Doppler Secrets
        run: |
          doppler configure set token ${{ secrets.DOPPLER_TOKEN }}
          doppler secrets --project izistore --config prd --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file > .env

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Determine affected projects
        id: affected
        run: |
          BASE_BRANCH=$(git rev-parse --verify main~1 || echo main)
          echo "BASE_BRANCH=$BASE_BRANCH" >> $GITHUB_ENV
          AFFECTED=$(npx nx show projects --affected --base=$BASE_BRANCH --head=HEAD)
          if [ -z "$AFFECTED" ]; then
              echo "No affected services. Deploying all services."
              AFFECTED=api-gateway
          fi
          echo "AFFECTED=$AFFECTED" >> $GITHUB_ENV

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker images using docker-compose
        run: |
          for service in $AFFECTED; do
             docker compose build $service
             docker push ${{ secrets.DOCKER_USERNAME }}/izistore-backend-microservices:$service
           done

  deploy:
    name: Deploy Changed Services
    runs-on: ubuntu-latest
    needs: docker
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }} # Use secrets for sensitive info
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_TARGET_PATH: /home/${{secrets.EC2_USER}}/izistore-backend-microservices
      KUBECONFIG_PATH: /home/${{secrets.EC2_USER}}/.kube/config

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Copy Files to EC2
        run: |
          rsync -avz --exclude '.git' ./ ${EC2_USER}@${EC2_HOST}:${EC2_TARGET_PATH}

      - name: Pull Images from Docker Hub and Deploy to Kind Cluster
        run: |
          ssh -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} << EOF
            cd ${EC2_TARGET_PATH}

            # Login to Docker Hub (If needed for private images)
            echo ${{ secrets.DOCKER_PASSWORD }} | docker login --username foo --password-stdin
            
            # Pull and load images to Kind cluster
            images=(
              nebur242/izistore-backend-microservices:api-gateway
            )

            for image in "\${images[@]}"; do
              docker pull \$image
              kind load docker-image \$image
            done

            # Set KUBECONFIG
            export KUBECONFIG=${KUBECONFIG_PATH}

            # Apply Kubernetes manifests
            kubectl apply -f kubernetes/*.yaml
            echo "Deployment Complete!"
          EOF
