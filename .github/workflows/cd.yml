name: Continuous Deployment

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed
  pull_request:
    types:
      - closed

jobs:
  docker:
    name: Build and Deploy Changed Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Fetch Doppler Secrets
        run: |
          doppler configure set token ${{ secrets.DOPPLER_TOKEN }}
          doppler secrets --project izistore --config prd --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file > .env

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Determine affected projects
        id: affected
        run: |
          BASE_BRANCH=$(git rev-parse --verify main~1 || echo main)
          echo "BASE_BRANCH=$BASE_BRANCH" >> $GITHUB_ENV
          AFFECTED=$(npx nx show projects --affected --base=$BASE_BRANCH --head=HEAD)
          if [ -z "$AFFECTED" ]; then
              echo "No affected services. Deploying all services."
              AFFECTED=api-gateway
          fi
          echo "AFFECTED=$AFFECTED" >> $GITHUB_ENV

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker images using docker-compose
        run: |
          for service in $AFFECTED; do
             docker compose build $service
             docker push ${{ secrets.DOCKER_USERNAME }}/izistore-backend-microservices:$service
           done

  deploy:
    name: Deploy Changed Services
    runs-on: ubuntu-latest
    needs: docker
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }} # Use secrets for sensitive info
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up SSH Key
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Docker Hub
        run: |
          docker login -u ${{ env.DOCKERHUB_USERNAME }} -p ${{ env.DOCKERHUB_PASSWORD }}

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Copy files to EC2
        run: |
          scp -o StrictHostKeyChecking=no -r ./docker-compose.yml / ${EC2_USER}@${EC2_HOST}:/home/ec2-user/izistore-backend-microservices/

      - name: Optional - Post Deployment Steps
        run: echo "Deployment Complete!"
