name: DEV CD

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches: [develop]

jobs:
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.CLUSTER_NAME }}

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Fetch Doppler Secrets
        run: |
          doppler configure set token ${{ secrets.DOPPLER_TOKEN }}

          # Create directories
          mkdir -p k8s/base/dev/secrets

          # Fetch generic environment variables first
          doppler secrets --project maketou --config dev_generic --token "${{ secrets.DOPPLER_TOKEN }}" download --format=json --no-file > k8s/base/dev/secrets/generic-env.json

          # Fetch service-specific secrets and merge with generic env vars
          merge_secrets() {
            local service_config=$1
            local output_file=$2
            
            # Fetch service-specific secrets
            doppler secrets --project maketou --config "$service_config" --token "${{ secrets.DOPPLER_TOKEN }}" download --format=json --no-file > temp_secrets.json
            
            # Merge generic and service-specific secrets using jq
            jq -s '.[0] * .[1]' k8s/base/dev/secrets/generic-env.json temp_secrets.json > "$output_file"
            
            # Clean up temporary file
            rm temp_secrets.json
          }

          # Fetch and merge secrets for each service
          merge_secrets "dev_api-gateway" "k8s/base/dev/secrets/api-gateway.json"
          merge_secrets "dev_auth-service" "k8s/base/dev/secrets/auth-service.json"

      - name: Create Kubernetes Secrets
        run: |
          # Create namespace if it doesn't exist
          kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -

          # Function to create secret YAML with stringData
          create_secret_yaml() {
            local name=$1
            local json_file=$2
            local output_file=$3
            
            # Start YAML file
            echo "apiVersion: v1" > "$output_file"
            echo "kind: Secret" >> "$output_file"
            echo "metadata:" >> "$output_file"
            echo "  name: $name" >> "$output_file"
            echo "  namespace: dev" >> "$output_file"
            echo "type: Opaque" >> "$output_file"
            echo "stringData:" >> "$output_file"
            
            # Process JSON and properly escape values
            jq -r 'to_entries[] | "  \(.key): |-\n    \(.value | gsub("\\n";"\n    "))"' "$json_file" >> "$output_file"
          }

          # Create secret YAML files
          create_secret_yaml "api-gateway-secrets" "k8s/base/dev/secrets/api-gateway.json" "k8s/base/secrets/api-gateway.yaml"
          create_secret_yaml "auth-service-secrets" "k8s/base/dev/secrets/auth-service.json" "k8s/base/secrets/auth-service.yaml"

          # Debug: Check the created YAML files (optional)
          echo "Checking created secret files structure:"
          for file in k8s/base/dev/secrets/*.yaml; do
            echo "=== $file ==="
            head -n 5 "$file"
            echo "..."
          done

          # Apply secrets to cluster
          kubectl apply -f k8s/base/dev/secrets/api-gateway.yaml
          kubectl apply -f k8s/base/dev/secrets/auth-service.yaml

      - name: Update Deployment Files
        run: |
          # Update deployment files with Docker username
          sed -i 's/${DOCKER_USERNAME}/${{ secrets.DOCKER_USERNAME }}/g' k8s/base/dev/api-gateway.yaml
          sed -i 's/${DOCKER_USERNAME}/${{ secrets.DOCKER_USERNAME }}/g' k8s/base/dev/auth-service.yaml

      - name: Deploy Applications
        run: |
          # Apply Kubernetes manifests using the dev overlay
          kubectl apply -k k8s/overlays/dev

          # Wait for deployments to roll out
          sleep 30

          # Debug information
          echo "Checking pod status..."
          kubectl get pods -n dev

          echo "Checking pod details..."
          kubectl describe pods -n dev

          echo "Checking logs..."
          for pod in $(kubectl get pods -n dev -l app=api-gateway -o jsonpath='{.items[*].metadata.name}'); do
            echo "Logs for $pod:"
            kubectl logs -n dev $pod
          done

          for pod in $(kubectl get pods -n dev -l app=auth-service -o jsonpath='{.items[*].metadata.name}'); do
            echo "Logs for $pod:"
            kubectl logs -n dev $pod
          done

          # Continue with rollout status
          kubectl rollout status deployment/api-gateway -n dev --timeout=3000s
          kubectl rollout status deployment/auth-service -n dev --timeout=3000s

      - name: Verify Deployment
        run: |
          echo "Checking pod status..."
          kubectl get pods -n dev

          echo "Checking services..."
          kubectl get services -n dev

          echo "Checking configmaps and secrets..."
          kubectl get configmap -n dev
          kubectl get secrets -n dev
