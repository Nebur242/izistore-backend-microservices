name: CD

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.CLUSTER_NAME }}

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Debug Doppler Variables
        run: |
          echo "Checking Doppler variables..."
          echo "=== Available Variables ==="
          doppler secrets --project maketou --config dev_maketou --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file | grep -E "FIREBASE_" | cut -d '=' -f1

      - name: Create Namespace
        run: kubectl create namespace prod --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Secrets from Doppler
        run: |
          # API Gateway secrets
          {
            doppler secrets --project maketou --config dev_maketou --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file
            doppler secrets --project maketou --config dev_api-gateway --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file
          } > temp_env
          kubectl create secret generic api-gateway-secrets \
            --namespace=prod \
            --from-env-file=temp_env \
            --dry-run=client -o yaml | kubectl apply -f -
          rm temp_env

          # Auth Service secrets
          {
            doppler secrets --project maketou --config dev_maketou --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file
            doppler secrets --project maketou --config dev_auth-service --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file
          } > temp_env
          kubectl create secret generic auth-service-secrets \
            --namespace=prod \
            --from-env-file=temp_env \
            --dry-run=client -o yaml | kubectl apply -f -
          rm temp_env

      - name: Update base kustomization file
        run: |
          cd k8s/base

          # Create kustomization.yaml
          cat > kustomization.yaml << EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization

          resources:
            - api-gateway.yaml
            - auth-service.yaml
            - redis.yaml
            - postgres.yaml
            - ingress.yaml

          configMapGenerator:
            - name: app-config
              literals:
                - REDIS_HOST=redis-service
                - REDIS_PORT=6379
                - DB_HOST=postgres-service
                - DB_PORT=5432
                - NODE_ENV=production
                - AUTH_SERVICE_HOST=auth-service-service
                - AUTH_SERVICE_PORT=80
                - API_GATEWAY_HOST=api-gateway-service
                - API_GATEWAY_PORT=80
          EOF

          # Replace image references in deployment files
          for file in api-gateway.yaml auth-service.yaml; do
            sed -i "s|\${DOCKER_USERNAME}|${{ secrets.DOCKER_USERNAME }}|g" $file
          done

      - name: Update Postgres StatefulSet
        run: |
          # Update postgres.yaml to use postgres-secrets
          sed -i 's/name: app-secrets/name: postgres-secrets/g' k8s/base/postgres.yaml

      - name: Deploy to DigitalOcean Kubernetes
        run: |
          # Apply Kubernetes manifests
          kubectl apply -k k8s/overlays/prod

          # Wait for pods to start
          sleep 30

          # Debug information
          echo "Pod Status:"
          kubectl get pods -n prod

          echo "Pod Details:"
          kubectl describe pods -n prod

          echo "Pod Logs:"
          for pod in $(kubectl get pods -n prod -l app=postgres -o jsonpath='{.items[*].metadata.name}'); do
            echo "Logs for $pod:"
            kubectl logs -n prod $pod
          done

          # Verify deployments
          kubectl rollout status statefulset/postgres -n prod --timeout=300s
          kubectl rollout status deployment/api-gateway -n prod --timeout=300s
          kubectl rollout status deployment/auth-service -n prod --timeout=300s
