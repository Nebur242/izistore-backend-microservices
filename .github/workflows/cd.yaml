name: CD

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.CLUSTER_NAME }}

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Fetch Doppler Secrets
        run: |
          doppler configure set token ${{ secrets.DOPPLER_TOKEN }}
          doppler secrets --project maketou --config dev_maketou --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file > .env
          doppler secrets --project maketou --config dev_api-gateway --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file > apps/api-gateway/.env
          doppler secrets --project maketou --config dev_auth-service --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file > apps/auth-service/.env

      - name: Create Kubernetes ConfigMaps and Secrets
        run: |
          # Create namespace if it doesn't exist
          kubectl create namespace prod --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic api-gateway-secrets --from-env-file=.env -o yaml --dry-run=client > k8s/base/secrets/apps.yaml
          kubectl create secret generic api-gateway-secrets --from-env-file=apps/api-gateway/.env -o yaml --dry-run=client > k8s/base/secrets/api-gateway.yaml
          kubectl create secret generic auth-service-secrets --from-env-file=apps/auth-service/.env -o yaml --dry-run=client > k8s/base/secrets/auth-service.yaml

          # Apply the secrets to cluster            
          echo "Applying k8s secrets..."
          kubectl apply -f k8s/base/secrets/apps.yaml
          kubectl apply -f k8s/base/secrets/api-gateway.yaml
          kubectl apply -f k8s/base/secrets/auth-service.yaml

          # Create ConfigMap for shared configuration
          kubectl create configmap app-config \
            --namespace=prod \
            --from-literal=REDIS_HOST=redis-service \
            --from-literal=REDIS_PORT=6379 \
            --from-literal=DB_HOST=postgres-service \
            --from-literal=DB_PORT=5432 \
            --from-literal=NODE_ENV=production \
            --from-literal=AUTH_SERVICE_HOST=auth-service-service \
            --from-literal=AUTH_SERVICE_PORT=3002 \
            --from-literal=API_GATEWAY_HOST=api-gateway-service \
            --from-literal=API_GATEWAY_PORT=80 \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update Deployment Files
        run: |
          # Update deployment files with Docker username
          sed -i 's/${DOCKER_USERNAME}/${{ secrets.DOCKER_USERNAME }}/g' k8s/base/api-gateway.yaml
          sed -i 's/${DOCKER_USERNAME}/${{ secrets.DOCKER_USERNAME }}/g' k8s/base/auth-service.yaml

      - name: Deploy to DigitalOcean Kubernetes
        run: |
          # Apply Kubernetes manifests using the prod overlay
          kubectl apply -k k8s/overlays/prod

          # Wait for a moment to let pods start
          sleep 30

          # Debug information
          echo "Checking pod status..."
          kubectl get pods -n prod

          echo "Checking pod details..."
          kubectl describe pods -n prod

          echo "Checking logs..."
          for pod in $(kubectl get pods -n prod -l app=api-gateway -o jsonpath='{.items[*].metadata.name}'); do
            echo "Logs for $pod:"
            kubectl logs -n prod $pod
          done

          # Continue with rollout status
          kubectl rollout status deployment/api-gateway -n prod --timeout=300s
          kubectl rollout status deployment/auth-service -n prod --timeout=300s

      - name: Verify Deployment
        run: |
          echo "Checking pod status..."
          kubectl get pods -n prod

          echo "Checking services..."
          kubectl get services -n prod

          echo "Checking configmaps and secrets..."
          kubectl get configmap -n prod
          kubectl get secrets -n prod
