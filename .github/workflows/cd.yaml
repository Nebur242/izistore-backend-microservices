name: CD

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.CLUSTER_NAME }}

      - name: Create secrets directory
        run: mkdir -p k8s/base/secrets

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Fetch Doppler Secrets
        run: |
          doppler configure set token ${{ secrets.DOPPLER_TOKEN }}
          doppler secrets --project maketou --config dev_maketou --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file > k8s/base/secrets/.env
          doppler secrets --project maketou --config dev_api-gateway --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file > k8s/base/secrets/api-gateway.env
          doppler secrets --project maketou --config dev_auth-service --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file > k8s/base/secrets/auth-service.env

      - name: Update base kustomization file
        run: |
          cd k8s/base
          # Replace Docker username in deployment files
          sed -i 's/${DOCKER_USERNAME}/${{ secrets.DOCKER_USERNAME }}/g' api-gateway.yaml auth-service.yaml

          # Update or create kustomization.yaml
          cat > kustomization.yaml << EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization

          resources:
            - api-gateway.yaml
            - auth-service.yaml
            - redis.yaml
            - postgres.yaml
            - ingress.yaml

          secretGenerator:
            - name: app-secrets
              files:
                - secrets/api-gateway.env
                - secrets/auth-service.env
            - name: docker-registry-secret
              type: kubernetes.io/dockerconfigjson
              literals:
                - .dockerconfigjson='{"auths":{"https://index.docker.io/v1/":{"username":"${{ secrets.DOCKER_USERNAME }}","password":"${{ secrets.DOCKER_PASSWORD }}","auth":"$(echo -n "${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }}" | base64)"}}}' 

          configMapGenerator:
            - name: app-config
              literals:
                - REDIS_HOST=redis-service
                - REDIS_PORT=6379
                - DB_HOST=postgres-service
                - DB_PORT=5432
                - NODE_ENV=production
                - AUTH_SERVICE_HOST=auth-service-service
                - AUTH_SERVICE_PORT=80
                - API_GATEWAY_HOST=api-gateway-service
                - API_GATEWAY_PORT=80
          EOF

      - name: Create Docker Registry Secret
        run: |
          kubectl create namespace prod --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry docker-registry-secret \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="${{ secrets.DOCKER_USERNAME }}" \
            --docker-password="${{ secrets.DOCKER_PASSWORD }}" \
            --namespace=prod \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to DigitalOcean Kubernetes
        run: |
          # Apply Kubernetes manifests using the prod overlay
          kubectl apply -k k8s/overlays/prod

          # Wait for a moment to let pods start
          sleep 30

          # Debug information
          echo "Checking pod status..."
          kubectl get pods -n prod

          echo "Checking pod details..."
          kubectl describe pods -n prod

          echo "Checking logs..."
          for pod in $(kubectl get pods -n prod -l app=api-gateway -o jsonpath='{.items[*].metadata.name}'); do
            echo "Logs for $pod:"
            kubectl logs -n prod $pod
          done

          # Continue with rollout status
          kubectl rollout status deployment/api-gateway -n prod --timeout=300s
          kubectl rollout status deployment/auth-service -n prod --timeout=300s
