name: CD

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.CLUSTER_NAME }}

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Fetch Doppler Secrets
        run: |
          doppler configure set token ${{ secrets.DOPPLER_TOKEN }}

          # Create directories
          mkdir -p k8s/base/secrets

          # Fetch secrets from Doppler
          doppler secrets --project maketou --config dev_api-gateway --token "${{ secrets.DOPPLER_TOKEN }}" download --format=json --no-file > k8s/base/secrets/api-gateway.json
          doppler secrets --project maketou --config dev_auth-service --token "${{ secrets.DOPPLER_TOKEN }}" download --format=json --no-file > k8s/base/secrets/auth-service.json

      - name: Create Kubernetes Secrets
        run: |
          # Create namespace if it doesn't exist
          kubectl create namespace prod --dry-run=client -o yaml | kubectl apply -f -

          # Function to create secret YAML with stringData
          create_secret_yaml() {
            local name=$1
            local json_file=$2
            local output_file=$3
            
            # Start YAML file
            echo "apiVersion: v1" > "$output_file"
            echo "kind: Secret" >> "$output_file"
            echo "metadata:" >> "$output_file"
            echo "  name: $name" >> "$output_file"
            echo "  namespace: prod" >> "$output_file"
            echo "type: Opaque" >> "$output_file"
            echo "stringData:" >> "$output_file"
            
            # Process JSON and properly escape values
            jq -r 'to_entries[] | "  \(.key): |-\n    \(.value | gsub("\\n";"\n    "))"' "$json_file" >> "$output_file"
          }

          # Create secret YAML files
          create_secret_yaml "api-gateway-secrets" "k8s/base/secrets/api-gateway.json" "k8s/base/secrets/api-gateway.yaml"
          create_secret_yaml "auth-service-secrets" "k8s/base/secrets/auth-service.json" "k8s/base/secrets/auth-service.yaml"

          # Debug: Check the created YAML files (optional)
          echo "Checking created secret files structure:"
          for file in k8s/base/secrets/*.yaml; do
            echo "=== $file ==="
            head -n 5 "$file"
            echo "..."
          done
          # Create a temporary JSON file with the new values
          cat << EOF > patch.json
          {
            "stringData": {
              "POSTGRES_USER": "postgres",
              "POSTGRES_PASSWORD": "postgres",
              "POSTGRES_DB": "postgres"
            }
          }
          EOF

          # Apply the patch
          kubectl patch secret postgres-secrets -n prod --patch-file patch.json

          # Clean up the temporary file
          rm patch.json

          # Apply secrets to cluster
          kubectl apply -f k8s/base/secrets/api-gateway.yaml
          kubectl apply -f k8s/base/secrets/auth-service.yaml

          # Create ConfigMap for shared configuration
          kubectl create configmap app-config \
            --namespace=prod \
            --from-literal=REDIS_HOST=redis-service \
            --from-literal=REDIS_PORT=6379 \
            --from-literal=DB_HOST=autorack.proxy.rlwy.net \
            --from-literal=DB_PORT=27889 \
            --from-literal=NODE_ENV=production \
            --from-literal=AUTH_SERVICE_HOST=auth-service-service \
            --from-literal=AUTH_SERVICE_PORT=3002 \
            --from-literal=API_GATEWAY_HOST=api-gateway-service \
            --from-literal=API_GATEWAY_PORT=3001 \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create PostgreSQL PVC
        run: |
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: postgres-pvc
            namespace: prod
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
          EOF

      - name: Update Deployment Files
        run: |
          # Update deployment files with Docker username
          sed -i 's/${DOCKER_USERNAME}/${{ secrets.DOCKER_USERNAME }}/g' k8s/base/api-gateway.yaml
          sed -i 's/${DOCKER_USERNAME}/${{ secrets.DOCKER_USERNAME }}/g' k8s/base/auth-service.yaml

      - name: Deploy Applications
        run: |
          # Apply Kubernetes manifests using the prod overlay
          kubectl apply -k k8s/overlays/prod

          # Wait for deployments to roll out
          sleep 30

          # Debug information
          echo "Checking pod status..."
          kubectl get pods -n prod

          echo "Checking pod details..."
          kubectl describe pods -n prod

          echo "Checking logs..."
          for pod in $(kubectl get pods -n prod -l app=api-gateway -o jsonpath='{.items[*].metadata.name}'); do
            echo "Logs for $pod:"
            kubectl logs -n prod $pod
          done

          for pod in $(kubectl get pods -n prod -l app=auth-service -o jsonpath='{.items[*].metadata.name}'); do
            echo "Logs for $pod:"
            kubectl logs -n prod $pod
          done

          # Continue with rollout status
          kubectl rollout status deployment/api-gateway -n prod --timeout=3000s
          kubectl rollout status deployment/auth-service -n prod --timeout=3000s

      - name: Verify Deployment
        run: |
          echo "Checking pod status..."
          kubectl get pods -n prod

          echo "Checking services..."
          kubectl get services -n prod

          echo "Checking configmaps and secrets..."
          kubectl get configmap -n prod
          kubectl get secrets -n prod
