name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test Affected Projects
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: rootpassword
          POSTGRES_DB: izistore

      redis:
        image: redis:latest
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Fetch Doppler Secrets
        run: |
          doppler configure set token ${{ secrets.DOPPLER_TOKEN }}
          doppler secrets --project izistore --config prd --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file > .env

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Determine affected projects
        id: affected
        run: |
          BASE_BRANCH=$(git rev-parse --verify main || git rev-parse --verify master || echo "")
          if [ -z "$BASE_BRANCH" ]; then
            echo "Base branch not found. Defaulting to HEAD."
            BASE_BRANCH=HEAD
          fi
          echo "BASE_BRANCH=$BASE_BRANCH" >> $GITHUB_ENV

          AFFECTED=$(npx nx show projects --affected --base=$BASE_BRANCH --head=HEAD || echo "api-gateway")
          filtered=$(echo "$AFFECTED" | tr ' ' '\n' | grep -v "e2e" | tr '\n' ' ' | xargs)
          if [ -z "$filtered" ]; then
            filtered="api-gateway"
          fi
          echo "AFFECTED=$filtered" >> $GITHUB_ENV

      - name: Build affected projects
        run: npx nx affected --target=build --base=$BASE_BRANCH --head=HEAD
        env:
          BASE_BRANCH: ${{ env.BASE_BRANCH }}

      - name: Run tests for affected projects
        run: npx nx affected --target=test --base=$BASE_BRANCH --head=HEAD
        env:
          BASE_BRANCH: ${{ env.BASE_BRANCH }}

      - name: Run linting for affected projects
        run: npx nx affected --target=lint --base=$BASE_BRANCH --head=HEAD
        env:
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
