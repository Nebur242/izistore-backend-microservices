name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test Affected Projects
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: rootpassword
          POSTGRES_DB: izistore
        options: >-
          --health-cmd="pg_isready -U root" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:latest
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Determine affected projects
        id: affected
        run: |
          BASE_BRANCH=$(git rev-parse --verify main~1 || echo main)
          echo "BASE_BRANCH=$BASE_BRANCH" >> $GITHUB_ENV
          echo "AFFECTED_PROJECTS=$(npx nx print-affected --target=build --base=$BASE_BRANCH --head=HEAD)" >> $GITHUB_ENV

      - name: Build affected projects
        run: npx nx affected --target=build --base=$BASE_BRANCH --head=HEAD

      - name: Run tests for affected projects
        run: npx nx affected --target=test --base=$BASE_BRANCH --head=HEAD

      - name: Run linting for affected projects
        run: npx nx affected --target=lint --base=$BASE_BRANCH --head=HEAD
