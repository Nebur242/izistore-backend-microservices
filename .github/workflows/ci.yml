name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test Affected Projects
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: rootpassword
          POSTGRES_DB: izistore

      redis:
        image: redis:latest
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Fetch Doppler Secrets
        run: |
          doppler configure set token ${{ secrets.DOPPLER_TOKEN }}
          doppler secrets --project izistore --config prd --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file > .env

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Determine Affected Services
        run: |
          BASE_BRANCH=$(git rev-parse --verify main || echo "")
          if [ -z "$BASE_BRANCH" ]; then
            BASE_BRANCH=HEAD
          fi
          AFFECTED=$(npx nx show projects --affected --base=$BASE_BRANCH --head=HEAD || echo "")
          echo "$AFFECTED" > affected-services.txt

      - name: Upload Affected Services
        uses: actions/upload-artifact@v3
        with:
          name: affected-services
          path: affected-services.txt

      - name: Run linting for affected projects
        run: npx nx affected -t lint --base=origin/main --parallel=2

      - name: Build affected projects
        run: npx nx affected -t build --base=origin/main --parallel=2

      - name: Run tests for affected projects
        run: npx nx affected -t test --base=origin/main --parallel=2
