name: Deploy to DigitalOcean
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install -f

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Add known hosts
        run: ssh-keyscan -H ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts

      - name: Setup remote directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /root/maketou
            cd /root/maketou

            # Initialize git if not already a repository
            if [ ! -d .git ]; then
              git init
              git remote add origin ${{ github.server_url }}/${{ github.repository }}.git
            fi

      - name: Copy deployment files
        run: |
          # Create necessary directories
          ssh root@${{ secrets.DROPLET_IP }} "mkdir -p /root/maketou/apps/api-gateway /root/maketou/apps/auth-service"

          # Copy files
          scp docker-compose.prod.yml root@${{ secrets.DROPLET_IP }}:/root/maketou/
          scp nginx.conf root@${{ secrets.DROPLET_IP }}:/root/maketou/
          scp -r apps/api-gateway/docker root@${{ secrets.DROPLET_IP }}:/root/maketou/apps/api-gateway/
          scp -r apps/auth-service/docker root@${{ secrets.DROPLET_IP }}:/root/maketou/apps/auth-service/

      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/maketou

            # Install Doppler
            if ! command -v doppler &> /dev/null; then
              curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh | sudo sh
            fi

            # Configure Doppler and fetch secrets
            doppler configure set token "${{ secrets.DOPPLER_TOKEN }}"

            # Create env files with Doppler secrets
            mkdir -p apps/api-gateway apps/auth-service
            doppler secrets --project maketou --config dev_maketou --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file > .env
            doppler secrets --project maketou --config dev_api-gateway --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file > apps/api-gateway/.env.prod
            doppler secrets --project maketou --config dev_auth-service --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file > apps/auth-service/.env.prod

            # Deploy services
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --build

            # Cleanup
            docker image prune -f --all
