name: Deploy to DigitalOcean
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
        continue-on-error: false

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Create SSH key
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Setup remote directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /root/maketou/{apps/api-gateway,apps/auth-service}
            if [ ! -d /root/maketou/.git ]; then
              cd /root/maketou
              git init
              git remote add origin ${{ github.server_url }}/${{ github.repository }}.git
            fi

      - name: Copy deployment files
        env:
          DEPLOY_KEY: ~/.ssh/deploy_key
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
        run: |
          rsync -avz -e "ssh -i $DEPLOY_KEY" \
            docker-compose.prod.yml \
            nginx.conf \
            apps/api-gateway/docker \
            apps/auth-service/docker \
            root@$DROPLET_IP:/root/maketou/

      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@master
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/maketou

            # Install Doppler if not present
            if ! command -v doppler &> /dev/null; then
              curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh | sudo sh
            fi

            # Configure Doppler
            doppler configure set token "${{ secrets.DOPPLER_TOKEN }}"

            # Download environment files
            doppler secrets --project maketou --config dev_maketou --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file > .env
            doppler secrets --project maketou --config dev_api-gateway --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file > apps/api-gateway/.env.prod
            doppler secrets --project maketou --config dev_auth-service --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file > apps/auth-service/.env.prod

            # Deploy using Docker Compose
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --build

            # Cleanup old images
            docker image prune -f --all

            # Verify deployment
            sleep 10
            docker compose -f docker-compose.prod.yml ps
