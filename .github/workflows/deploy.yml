name: Deploy to DigitalOcean
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install -f

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Setup SSH key
        run: |
          eval "$(ssh-agent -s)"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' | ssh-add -
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Setup remote directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /root/maketou
            cd /root/maketou

            if [ ! -d .git ]; then
              git init
              git remote add origin ${{ github.server_url }}/${{ github.repository }}.git
            fi

      - name: Copy deployment files
        run: |
          ssh root@${{ secrets.DROPLET_IP }} "mkdir -p /root/maketou/apps/api-gateway /root/maketou/apps/auth-service"
          scp docker-compose.prod.yml root@${{ secrets.DROPLET_IP }}:/root/maketou/
          scp nginx.conf root@${{ secrets.DROPLET_IP }}:/root/maketou/
          scp -r apps/api-gateway/docker root@${{ secrets.DROPLET_IP }}:/root/maketou/apps/api-gateway/
          scp -r apps/auth-service/docker root@${{ secrets.DROPLET_IP }}:/root/maketou/apps/auth-service/

      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/maketou

            if ! command -v doppler &> /dev/null; then
              curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh | sudo sh
            fi

            doppler configure set token "${{ secrets.DOPPLER_TOKEN }}"

            mkdir -p apps/api-gateway apps/auth-service
            doppler secrets --project maketou --config dev_maketou --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file > .env
            doppler secrets --project maketou --config dev_maketou --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file > apps/api-gateway/.env.prod
            doppler secrets --project maketou --config dev_maketou --token "${{ secrets.DOPPLER_TOKEN }}" download --format=env --no-file > apps/auth-service/.env.prod

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --build

            docker image prune -f --all
