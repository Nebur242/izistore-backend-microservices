kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080 # Map Kind's port 30080 to EC2's 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 80 # Map Kind's port 80 to EC2's 80
        hostPort: 80
        protocol: TCP
