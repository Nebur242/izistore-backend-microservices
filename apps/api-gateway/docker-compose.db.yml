services:
  postgres:
    image: postgres:13
    container_name: izistore_postgres_api_gateway
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/api-gateway/data

volumes:
  postgres_data:
    driver: local
