services:
  api-gateway:
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
    image: nebur242/izistore-backend-microservices:latest
    container_name: izistore_api_gateway
    ports:
      - "3000:3000"
      
    environment:
      env_file: ".env"
    depends_on:
      - redis
      - postgres

    develop:
      watch:
        - action: sync
          path: ./apps/api-gateway
          target: /usr/src/app/apps/api-gateway
          ignore:
            - node_modules/
        - action: rebuild
          path: ./apps/api-gateway

  redis:
    image: redis:latest
    container_name: izistore_redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:13
    container_name: izistore_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
