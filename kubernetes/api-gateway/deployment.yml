apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: nebur242/izistore-backend-microservices:api-gateway
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: secret-env-vars
