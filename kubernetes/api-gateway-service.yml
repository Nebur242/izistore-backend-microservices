apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  labels:
    app: api-gateway
spec:
  type: NodePort
  ports:
    - protocol: TCP
      port: 80 # Kubernetes service port
      targetPort: 3000 # Port in the container
      nodePort: 30080 # Port exposed on the host
  selector:
    app: api-gateway
